name: SAST with Mistral

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt semgrep

      - name: Run Semgrep and export JSON
        run: |
          set +e
          python sast_semgrep.py . \
            --json-file semgrep-results.json \
            --sarif-file semgrep-dataflow.sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          python sast_evidence.py \
            --semgrep-report semgrep-results.json \
            --sarif-report semgrep-dataflow.sarif \
            --root . \
            --local-report local-evidence.json \
            --sanitized-report mistral-evidence.json
          if [ "$status" -eq 1 ]; then
            echo "::notice::Semgrep findings are reported but do not fail this SAST workflow."
          fi

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload allowlisted Mistral evidence
        if: always() && hashFiles('mistral-evidence.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mistral-evidence
          path: mistral-evidence.json
          retention-days: 14

  mistral-triage:
    needs: sast
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: mistral-analysis
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download allowlisted Mistral evidence
        uses: actions/download-artifact@v8
        with:
          name: mistral-evidence

      - name: Triage findings with Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$MISTRAL_API_KEY" ]; then
            python sast_mistral.py . \
              --evidence-report mistral-evidence.json \
              --json-report mistral-triage.json
          else
            echo "::notice::Configure MISTRAL_API_KEY in the mistral-analysis environment to enable triage."
          fi

      - name: Upload Mistral triage report
        if: always() && hashFiles('mistral-triage.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mistral-triage
          path: mistral-triage.json
          retention-days: 14
