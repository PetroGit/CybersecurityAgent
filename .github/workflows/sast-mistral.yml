
name: SAST with Mistral

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      approved_source:
        description: "Repository-relative source file approved for external Mistral analysis"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt semgrep

      - name: Run Semgrep and export JSON
        run: |
          set +e
          python sast_semgrep.py . \
            --json-file semgrep-results.json \
            --sarif-file semgrep-dataflow.sarif
          status=$?
          set -e

          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

          python sast_evidence.py \
            --semgrep-report semgrep-results.json \
            --sarif-report semgrep-dataflow.sarif \
            --root . \
            --local-report local-evidence.json \
            --sanitized-report mistral-evidence.json

          if [ "$status" -eq 1 ]; then
            echo "::notice::Semgrep findings require review."
          fi

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload allowlisted Mistral evidence
        if: always() && hashFiles('mistral-evidence.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mistral-evidence
          path: mistral-evidence.json
          retention-days: 14

  mistral-triage:
    needs: sast
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    runs-on: ubuntu-24.04
    environment: mistral-analysis

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download allowlisted Mistral evidence
        uses: actions/download-artifact@v8
        with:
          name: mistral-evidence

      - name: Test Mistral API latency
        continue-on-error: true
        timeout-minutes: 3
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::notice::MISTRAL_API_KEY is not configured."
            exit 0
          fi

          python - <<'PY'
          import os
          import time
          from mistralai.client import Mistral

          client = Mistral(
              api_key=os.environ["MISTRAL_API_KEY"],
              timeout_ms=30000,
              retry_config="none",
          )

          start = time.monotonic()

          try:
              response = client.chat.complete(
                  model="mistral-large-4",
                  messages=[
                      {
                          "role": "user",
                          "content": "Reply with exactly OK."
                      }
                  ],
              )

              elapsed = time.monotonic() - start
              print(f"API latency: {elapsed:.2f}s")
              print("API status: SUCCESS")

          except Exception as exc:
              elapsed = time.monotonic() - start
              print(f"API latency: {elapsed:.2f}s")
              print(f"API status: FAILED ({type(exc).__name__})")
              raise
          PY

      - name: Triage findings with Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$MISTRAL_API_KEY" ]; then
            python sast_mistral.py . \
              --evidence-report mistral-evidence.json \
              --json-report mistral-triage.json
          else
            echo "::notice::Configure MISTRAL_API_KEY in the mistral-analysis environment."
          fi

      - name: Upload Mistral triage report
        if: always() && hashFiles('mistral-triage.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mistral-triage
          path: mistral-triage.json
          retention-days: 14

  remote-remediation:
    needs: [sast, mistral-triage]

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    environment: mistral-analysis
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Download SAST report
        uses: actions/download-artifact@v8
        with:
          name: semgrep-results

      - name: Build existing validation image
        run: |
          docker build \
            -f Dockerfile.validator \
            -t cybersecurityagent-validator:local .

      - name: Generate and validate remote proposal
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          APPROVED_SOURCE: ${{ inputs.approved_source }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::MISTRAL_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$APPROVED_SOURCE" ]; then
            echo "::error::approved_source is required."
            exit 1
          fi

          python ci_remote_remediation.py \
            --results semgrep-results.json \
            --allow-file "$APPROVED_SOURCE" \
            --max-findings 3 \
            --validate

      - name: Upload remediation proposals and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-remediation-review
          path: |
            remediation/ci-remote-summary.json
            remediation/ci-validation-*.json
            remediation/remote-proposals/finding-*.md
            remediation/remote-proposals/finding-*.lint.json
          if-no-files-found: warn
          retention-days: 7
