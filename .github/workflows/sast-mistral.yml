name: SAST with Mistral

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt semgrep

      - name: Run SAST
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$MISTRAL_API_KEY" ]; then
            python sast_mistral.py .
          else
            echo "::notice::MISTRAL_API_KEY is unavailable; running Semgrep without Mistral enrichment."
            if python sast_semgrep.py .; then
              :
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
              echo "::notice::Semgrep findings were reported; findings do not fail this workflow."
            fi
          fi
